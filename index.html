<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Equipment Follow-Up — HAC PMV</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;--accent:#f0a500;--text:#e6edf3;--muted:#7d8590;--green:#3fb950;--red:#f85149;--blue:#58a6ff;--purple:#bc8cff;--orange:#ffa657;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",sans-serif;font-size:14px;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-size:13px;font-weight:700;color:var(--accent);}
.logo span{color:var(--muted);font-weight:400;}
.content{padding:24px 32px;}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 18px;}
.kpi-val{font-size:26px;font-weight:700;font-family:monospace;}
.kpi-label{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;}
.filters{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.search-box{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;outline:none;}
.search-box:focus{border-color:var(--accent);}
select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;cursor:pointer;outline:none;}
.btn{border:none;padding:8px 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-clear{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-export{background:var(--accent);color:#000;}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.tab{padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);}
.tab.active-All{border-color:var(--accent);color:var(--accent);background:rgba(240,165,0,.1);}
.tab.active-Rental{border-color:var(--blue);color:var(--blue);background:rgba(88,166,255,.1);}
.tab.active-Transfer{border-color:var(--green);color:var(--green);background:rgba(63,185,80,.1);}
.tab.active-Pending{border-color:var(--orange);color:var(--orange);background:rgba(255,166,87,.1);}
.tab.active-Hold{border-color:var(--purple);color:var(--purple);background:rgba(188,140,255,.1);}
.tab.active-Cancel{border-color:var(--red);color:var(--red);background:rgba(248,81,73,.1);}
.count{font-size:12px;color:var(--muted);margin-bottom:10px;}
.count strong{color:var(--text);}
.table-wrap{border:1px solid var(--border);border-radius:8px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;white-space:nowrap;}
thead{background:var(--surface2);}
th{padding:9px 13px;text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);cursor:pointer;}
th:hover{color:var(--text);}
td{padding:9px 13px;border-bottom:1px solid var(--border);font-size:13px;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.b-Rental{background:rgba(88,166,255,.15);color:var(--blue);border:1px solid rgba(88,166,255,.3);}
.b-Transfer{background:rgba(63,185,80,.15);color:var(--green);border:1px solid rgba(63,185,80,.3);}
.b-Pending{background:rgba(255,166,87,.15);color:var(--orange);border:1px solid rgba(255,166,87,.3);}
.b-Hold{background:rgba(188,140,255,.15);color:var(--purple);border:1px solid rgba(188,140,255,.3);}
.b-Cancel{background:rgba(248,81,73,.15);color:var(--red);border:1px solid rgba(248,81,73,.3);}
.mono{font-family:monospace;font-size:12px;color:var(--accent);}
.empty{text-align:center;padding:50px;color:var(--muted);}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">HAC · PMV <span>Equipment Follow-Up 2026</span></div>
  <div style="font-size:12px;color:var(--muted)">Support Division · 10th of Ramadan Sector</div>
</div>
<div class="content">
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-val" id="k-total" style="color:var(--accent)">—</div><div class="kpi-label">Total</div></div>
    <div class="kpi"><div class="kpi-val" id="k-rental" style="color:var(--blue)">—</div><div class="kpi-label">Rental</div></div>
    <div class="kpi"><div class="kpi-val" id="k-transfer" style="color:var(--green)">—</div><div class="kpi-label">Transfer</div></div>
    <div class="kpi"><div class="kpi-val" id="k-pending" style="color:var(--orange)">—</div><div class="kpi-label">Pending</div></div>
    <div class="kpi"><div class="kpi-val" id="k-hold" style="color:var(--purple)">—</div><div class="kpi-label">Hold / Cancel</div></div>
  </div>
  <div class="filters">
    <input class="search-box" id="search" placeholder="Search equipment, project, engineer, SAP..." oninput="applyFilters()">
    <select id="f-equip" onchange="applyFilters()"><option value="">All Equipment</option></select>
    <select id="f-sap" onchange="applyFilters()"><option value="">All SAP</option></select>
    <button class="btn btn-clear" onclick="clearFilters()">✕ Clear</button>
    <button class="btn btn-export" onclick="exportCSV()">⬇ Export CSV</button>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active-All" data-m="All" onclick="setMethod('All')">All</div>
    <div class="tab" data-m="Rental" onclick="setMethod('Rental')">🔵 Rental</div>
    <div class="tab" data-m="Transfer" onclick="setMethod('Transfer')">🟢 Transfer</div>
    <div class="tab" data-m="Pending" onclick="setMethod('Pending')">🟠 Pending</div>
    <div class="tab" data-m="Hold" onclick="setMethod('Hold')">🟣 Hold</div>
    <div class="tab" data-m="Cancel" onclick="setMethod('Cancel')">🔴 Cancel</div>
  </div>
  <div class="count" id="count"></div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th onclick="sortBy('sn')">#</th>
        <th onclick="sortBy('equipment')">Equipment</th>
        <th onclick="sortBy('capacity')">Capacity</th>
        <th onclick="sortBy('qty')">Qty</th>
        <th onclick="sortBy('sap')">SAP</th>
        <th onclick="sortBy('project')">Project</th>
        <th onclick="sortBy('engineer')">Engineer</th>
        <th onclick="sortBy('submissionDate')">Submission</th>
        <th onclick="sortBy('method')">Method</th>
        <th onclick="sortBy('dateFrom')">From</th>
        <th onclick="sortBy('dateTo')">To</th>
        <th onclick="sortBy('days')">Days</th>
        <th>Notes</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

var filtered = ALL_DATA.slice();
var activeMethod = 'All';
var sortKey = 'sn', sortDir = 1;

function init(){
  var equips = [...new Set(ALL_DATA.map(d=>d.equipment).filter(Boolean))].sort();
  var saps   = [...new Set(ALL_DATA.map(d=>d.sap).filter(Boolean))].sort();
  var eq = document.getElementById('f-equip');
  var sp = document.getElementById('f-sap');
  equips.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;eq.appendChild(o);});
  saps.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;sp.appendChild(o);});
  updateKPI();
  render();
}

function updateKPI(){
  document.getElementById('k-total').textContent    = ALL_DATA.length;
  document.getElementById('k-rental').textContent   = ALL_DATA.filter(function(d){return d.method==='Rental';}).length;
  document.getElementById('k-transfer').textContent = ALL_DATA.filter(function(d){return d.method==='Transfer';}).length;
  document.getElementById('k-pending').textContent  = ALL_DATA.filter(function(d){return d.method==='Pending';}).length;
  document.getElementById('k-hold').textContent     = ALL_DATA.filter(function(d){return d.method==='Hold'||d.method==='Cancel';}).length;
}

function applyFilters(){
  var q   = document.getElementById('search').value.toLowerCase();
  var eq  = document.getElementById('f-equip').value;
  var sap = document.getElementById('f-sap').value;
  filtered = ALL_DATA.filter(function(d){
    if(activeMethod !== 'All' && d.method !== activeMethod) return false;
    if(eq  && d.equipment !== eq) return false;
    if(sap && d.sap !== sap) return false;
    if(q){
      var hay = [d.equipment,d.project,d.engineer,d.sap,d.capacity,d.notes].join(' ').toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  render();
}

function setMethod(m){
  activeMethod = m;
  document.querySelectorAll('.tab').forEach(function(t){
    t.className = 'tab' + (t.dataset.m === m ? ' active-'+m : '');
  });
  applyFilters();
}

function sortBy(key){
  if(sortKey===key) sortDir*=-1; else{sortKey=key;sortDir=1;}
  render();
}

function render(){
  var sorted = filtered.slice().sort(function(a,b){
    var av=a[sortKey]||'', bv=b[sortKey]||'';
    var an=parseFloat(av), bn=parseFloat(bv);
    if(!isNaN(an)&&!isNaN(bn)) return (an-bn)*sortDir;
    return av.localeCompare(bv)*sortDir;
  });
  document.getElementById('count').innerHTML = 'Showing <strong>'+sorted.length+'</strong> of <strong>'+ALL_DATA.length+'</strong> records';
  var tbody = document.getElementById('tbody');
  if(!sorted.length){tbody.innerHTML='<tr><td colspan="13" class="empty">No records found</td></tr>';return;}
  tbody.innerHTML = sorted.map(function(d){
    return '<tr><td class="mono">'+esc(d.sn)+'</td><td style="font-weight:600">'+esc(d.equipment)+'</td><td style="color:var(--muted)">'+esc(d.capacity)+'</td><td style="text-align:center">'+esc(d.qty)+'</td><td class="mono">'+esc(d.sap)+'</td><td style="max-width:180px;overflow:hidden;text-overflow:ellipsis" title="'+esc(d.project)+'">'+esc(d.project)+'</td><td style="color:var(--muted);font-size:12px">'+esc(d.engineer)+'</td><td style="font-size:12px">'+esc(d.submissionDate)+'</td><td><span class="badge b-'+d.method+'">'+esc(d.method)+'</span></td><td style="font-size:12px">'+esc(d.dateFrom)+'</td><td style="font-size:12px">'+esc(d.dateTo)+'</td><td style="text-align:center;font-family:monospace">'+esc(d.days)+'</td><td style="color:var(--muted);font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis" title="'+esc(d.notes)+'">'+esc(d.notes)+'</td></tr>';
  }).join('');
}

function esc(v){
  return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function clearFilters(){
  document.getElementById('search').value='';
  document.getElementById('f-equip').value='';
  document.getElementById('f-sap').value='';
  activeMethod='All';
  document.querySelectorAll('.tab').forEach(function(t){t.className='tab'+(t.dataset.m==='All'?' active-All':'');});
  applyFilters();
}

function exportCSV(){
  var headers=['S/N','Equipment','Capacity','Qty','SAP','Project','Engineer','Contact','Submission','Method','From','To','Days','Notes'];
  var rows=filtered.map(function(d){return[d.sn,d.equipment,d.capacity,d.qty,d.sap,d.project,d.engineer,d.contact,d.submissionDate,d.method,d.dateFrom,d.dateTo,d.days,d.notes].map(function(v){return '"'+String(v||'').replace(/"/g,'""')+'"';}).join(',');});
  var csv=[headers.join(',')].concat(rows).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='FollowUp_Export.csv';
  a.click();
}

init();
</script>
